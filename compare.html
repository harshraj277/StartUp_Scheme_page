<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Yojana Setu — side-by-side comparison of the government startup schemes you selected.">
<meta name="theme-color" content="#09264a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2309264a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial,sans-serif' font-weight='900' fill='%23d8a52c' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<title>Compare schemes — Yojana Setu</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="compare-page">
<header>
  <div class="container nav">
    <div class="branding">
      <a class="brandlink" href="index.html">
        <img class="logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2309264a'/%3E%3Cpath d='M32 30 L50 52 L68 30 M50 52 L50 76' fill='none' stroke='%23d8a52c' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" alt="" aria-hidden="true">
        <div class="divider"></div>
        <div class="brandname">Compare</div>
      </a>
    </div>
    <a class="btn btn-outline" href="index.html#schemes">← Back to schemes</a>
  </div>
</header>

<main>
  <div class="container">
    <div class="section-head">
      <div class="eyebrow">Compare</div>
      <h1>Side-by-side comparison</h1>
      <p class="dash-mini" id="compareSub"></p>
    </div>

    <div class="compare-tools">
      <button class="btn btn-light" id="diffRowsBtn" hidden>Highlight differences</button>
      <span class="dash-mini" id="colCount"></span>
    </div>

    <div class="stale-note" id="compareMissing" hidden></div>
    <div class="compare" id="compare"></div>

    <p class="ref-note">Everything here is read from the same dataset the rest of the site uses. Verify current eligibility on the official source before you apply — schemes change, and this page reflects the data as at <b id="asAt"></b>.</p>
  </div>
</main>

<script src="data/schemes.js"></script>
<script src="js/util.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
